name: Build & Release (Android APK, Play Store AAB & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK, Google Play AAB & iOS Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Install Capacitor & Platforms
        run: |
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest

      - name: Setup Android & iOS Native Projects
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi
          if [ ! -d "ios" ]; then
            echo "Adding iOS platform..."
            npx cap add ios || true
          fi
          npx cap sync

      - name: Grant Execute Permission for Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK (Installable on any Android phone)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB (Google Play Store Bundle)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Prepare Release Packages
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/WeatherGlobe-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-assets/WeatherGlobe-GooglePlay.aab
          zip -r release-assets/WeatherGlobe-iOS-Project.zip ios dist capacitor.config.json

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: WeatherGlobe-App-Packages
          path: release-assets/*
          retention-days: 30

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "WeatherGlobe v1.0.0 — Official App Release (APK, AAB & iOS)"
          draft: false
          prerelease: false
          body: |
            # 🌍 WeatherGlobe Official Release v1.0.0

            Complete multi-platform builds for WeatherGlobe:

            ### 📦 Download Files:
            1. **`WeatherGlobe-Android.apk`**
               - Direct installable APK for Android phones and tablets.
               - Compatible with Android 7.0 to Android 15+.
               - Ready for testing and publishing to Uptodown, APKPure, etc.

            2. **`WeatherGlobe-GooglePlay.aab`**
               - Official Google Play Store production bundle (Android App Bundle).
               - Meets Google Play Target SDK and 64-bit architecture requirements.

            3. **`WeatherGlobe-iOS-Project.zip`**
               - Native iOS project with Capacitor.
               - Ready to open in Xcode for App Store submission or TestFlight.
               - Instant iOS installation also available via Safari **"Add to Home Screen"**.

            ---
            *Built automatically via GitHub Actions CI/CD.*
          files: |
            release-assets/WeatherGlobe-Android.apk
            release-assets/WeatherGlobe-GooglePlay.aab
            release-assets/WeatherGlobe-iOS-Project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
